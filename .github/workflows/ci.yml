name: VScan CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q app smoke_test.py
      - env:
          NEXVARY_ADMIN_PASSWORD: ChangeMe123!
        run: pytest -q
      - run: python smoke_test.py
