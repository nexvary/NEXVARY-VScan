<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXVARY VScan</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/command.css"><link rel="stylesheet" href="/static/stage1250.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">NX</div><div><b>NEXVARY</b><span>VSCAN</span></div></div><div class="side-label">SECURITY COMMAND</div><nav class="side-nav"><a class="{% if request.url.path == '/' %}active{% endif %}" href="/"><i>⌂</i><span>Overview</span></a><a class="{% if request.url.path.startswith('/admin') %}active{% endif %}" href="/admin"><i>✓</i><span>Team Approval</span></a><a class="{% if request.url.path == '/targets' %}active{% endif %}" href="/targets"><i>◎</i><span>Targets</span></a><a class="{% if request.url.path == '/scan-center' or request.url.path.startswith('/scans/') %}active{% endif %}" href="/scan-center"><i>⌁</i><span>Scan Center</span></a><a class="{% if request.url.path == '/reports' %}active{% endif %}" href="/reports"><i>▤</i><span>Reports</span></a></nav><div class="side-status"><span class="pulse"></span><div><b>ENGINE ONLINE</b><small>Authorized defensive mode · v{{version}}</small></div></div></aside><section class="workspace"><header class="topbar"><div><span class="eyebrow">NEXVARY / VSCAN</span><strong>SECURITY OPERATIONS</strong></div><div class="top-actions"><span class="stage-badge">STAGE 1750</span><span class="secure-pill">● SECURE SESSION</span>{% if user %}<span class="operator">{{user.username}}</span><form method="post" action="/logout"><button class="icon-btn" title="Logout">↪</button></form>{% endif %}</div></header><main>{% block content %}{% endblock %}</main></section></div></body></html>
